namespace: ns-dpn-01

app:
  name: dpn-file-scan-service

image:
  repository: ""
  tag: ""
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "200m"

keyvault:
  name: ""
  clientID: ""
  tenantId: "<<your specific value>>"

  objects:
    - name: FILESCAN-CLIENT-ID
      type: secret

    - name: FILESCAN-CLIENT-SECRET
      type: secret

    # OTEL PKCS#12 truststore (dpn-observability-truststore.p12), stored in
    # Key Vault as a base64-encoded secret since it is binary. Mounted by the
    # existing CSI volume at /mnt/keyvault, same as the client id/secret above.
    - name: FILESCAN-OTEL-TRUSTSTORE
      type: secret
      encoding: base64

    # Truststore password. Synced into a native Kubernetes Secret (see
    # keyvault.truststorePasswordSecretName / secret_provider_class.yaml)
    # because the app reads TRUSTSTORE_PASSWORD as an env VALUE, not a file.
    - name: FILESCAN-OTEL-TRUSTSTORE-PASSWORD
      type: secret

    # dpn-service-client's Keycloak client-credentials secret, used to
    # authenticate OTLP exports against the collector's oidc auth extension.
    # This is the same client (and Key Vault object) oauth2-proxy already
    # depends on - not a file-scan-specific credential.
    - name: KC-SERVICE-CLIENT-SECRET
      type: secret

  # Key Vault object name of the truststore password, used to sync it into a
  # native Kubernetes Secret via the CSI driver's secretObjects mechanism.
  # Leave empty to disable (no TRUSTSTORE_PASSWORD env var is set).
  truststorePasswordSecretName: ""

  # Key Vault object name of the dpn-service-client secret, synced the same
  # way as truststorePasswordSecretName above. Leave empty to disable (no
  # OTEL_OAUTH_CLIENT_SECRET env var is set, and OAuth stays off since
  # otel_oauth.py requires a secret once CLIENT_ID/TOKEN_ENDPOINT_URL are set).
  otelOauthClientSecretName: ""



service:
  type: ClusterIP
  portName: filescan  # Port name should be within 15
  port: 8080
  targetPort: 8080    # Container port


hpa:
  enabled: true

  components:
    file-scan-service:
      min: 1                          
      max: 3

  scaleUp:
    cpuUtilization: 80     
    memoryUtilization: 80

  scaleUpBehavior:
    stabilizationWindowSeconds: 60
    policies:
      - type: Pods
        value: 1                      # faster scale up
        periodSeconds: 60

  scaleDown:
    stabilizationWindowSeconds: 300   ## Scale Down Period  
    policies:
      - type: Percent
        value: 50                     # scale down up to 50% at once
        periodSeconds: 60
env:
  environment: "development"
  logLevel: "info"

  enableTelemetry: "true"
  testing: "false"
  otelEndpoint: ""
  otelExporterProtocol: "http/protobuf"
  otelExporterInsecure: "false"
  otelExporterCertificate: ""
  truststorePath: ""
  otelTlsSecretName: dpn-tls

  otelOauthEnabled: "true"
  otelOauthClientId: "dpn-service-client"
  otelOauthTokenEndpointUrl: ""
  # Left empty deliberately - do NOT point this at truststore.jks.
  # otel_oauth.py's CA-loading dispatches on the ".jks" extension and expects
  # a real JKS binary format, but truststore.jks is actually PKCS#12 (same
  # file Kafka reads with ssl.truststore.type=PKCS12), so that crashes
  # startup with "Not a JKS or JCEKS keystore". Left unset, it falls back to
  # the OTLP CA (certificate_file), which is already correctly extracted via
  # otel_truststore.py's byte-sniffing dispatch - the same CA, reached the
  # working way. This is a workaround for a bug in otel_oauth.py (it should
  # byte-sniff like otel_truststore.py instead of trusting the extension).
  otelOauthCaLocation: ""
  serviceName: "file-scan-service"
  serviceVersion: "1.0.0"

  serviceBusNamespace: ""
  sourceStorageAccount: ""
  sourceContainer: ""
  destStorageAccount: ""
  destContainer: ""

  cloudprovidertype: "AZURE"
  tenantId: "<<your specific value>>"
  topicname: "dpn-fileupload-scan-results"
  subscriptionname: "dpn-fileupload-scan-results-sub"
  clientIdFile: "/mnt/keyvault/FILESCAN-CLIENT-ID"
  clientSecretFile: "/mnt/keyvault/FILESCAN-CLIENT-SECRET"