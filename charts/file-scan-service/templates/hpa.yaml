{{- if .Values.hpa.enabled }}
{{- range $name, $cfg := .Values.hpa.components }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Values.app.name }}

  minReplicas: {{ $cfg.min }}
  maxReplicas: {{ $cfg.max }}

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.scaleUp.cpuUtilization }}

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.scaleUp.memoryUtilization }}

  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $.Values.hpa.scaleUpBehavior.stabilizationWindowSeconds | default 60 }}
      policies:
{{- range $.Values.hpa.scaleUpBehavior.policies }}
        - type: {{ .type }}
          value: {{ .value }}
          periodSeconds: {{ .periodSeconds }}
{{- end }}

    scaleDown:
      stabilizationWindowSeconds: {{ $.Values.hpa.scaleDown.stabilizationWindowSeconds | default 300 }}
      policies:
{{- range $.Values.hpa.scaleDown.policies }}
        - type: {{ .type }}
          value: {{ .value }}
          periodSeconds: {{ .periodSeconds }}
{{- end }}

{{- end }}
{{- end }}
