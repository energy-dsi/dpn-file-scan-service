apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "{{ .Values.app.name }}-kv-secrets"
  namespace: {{ .Values.namespace }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"

    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"

    keyvaultName: "{{ .Values.keyvault.name }}"

    tenantId: "{{ .Values.keyvault.tenantId }}"


    objects: |
      array:
{{- range .Values.keyvault.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ .type }}
{{- if .encoding }}
          objectEncoding: {{ .encoding }}
{{- end }}
{{- end }}

# The truststore password used to be synced here too (as a private
# {app.name}-otel-truststore Secret, via keyvault.truststorePasswordSecretName)
# but that duplicated the identical Key Vault object tls-auth-secret already
# publishes platform-wide. deployment.yaml now reads TRUSTSTORE_PASSWORD from
# tls-auth-secret directly instead.

