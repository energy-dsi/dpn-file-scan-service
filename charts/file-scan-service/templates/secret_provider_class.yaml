apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "{{ .Values.app.name }}-kv-secrets"
  namespace: {{ .Values.namespace }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"

    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"

    keyvaultName: "{{ .Values.keyvault.name }}"

    tenantId: "{{ .Values.keyvault.tenantId }}"


    objects: |
      array:
{{- range .Values.keyvault.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ .type }}
{{- if .encoding }}
          objectEncoding: {{ .encoding }}
{{- end }}
{{- end }}

{{- if or .Values.keyvault.truststorePasswordSecretName .Values.keyvault.otelOauthClientSecretName }}
  # Sync values that the app reads as literal env VALUES (valueFrom.secretKeyRef)
  # rather than files into a native Kubernetes Secret - TRUSTSTORE_PASSWORD and
  # OTEL_OAUTH_CLIENT_SECRET are both read this way, not as mounted paths. Note:
  # the CSI driver only creates/updates this Secret once a pod actually mounts
  # this SecretProviderClass's CSI volume.
  secretObjects:
    - secretName: "{{ .Values.app.name }}-otel-truststore"
      type: Opaque
      data:
{{- if .Values.keyvault.truststorePasswordSecretName }}
        - objectName: {{ .Values.keyvault.truststorePasswordSecretName }}
          key: password
{{- end }}
{{- if .Values.keyvault.otelOauthClientSecretName }}
        # dpn-service-client's Keycloak secret - shared with oauth2-proxy,
        # which is why the Key Vault object name is the common
        # KC-SERVICE-CLIENT-SECRET, not a file-scan-specific one.
        - objectName: {{ .Values.keyvault.otelOauthClientSecretName }}
          key: oauth-client-secret
{{- end }}
{{- end }}

