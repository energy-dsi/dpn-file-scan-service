{{- if eq .Values.cloudProvider "aws" }}
{{- if .Values.secretsManager.enabled }}
# =============================================================================
# AWS Secrets Store CSI — pulls app secrets from AWS Secrets Manager
# =============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "{{ .Values.app.name }}-kv-secrets"
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secretsManager.secretPrefix }}/FILESCAN_CLIENT_ID"
        objectType: "secretsmanager"
        objectAlias: "FILESCAN-CLIENT-ID"
      - objectName: "{{ .Values.secretsManager.secretPrefix }}/FILESCAN_CLIENT_SECRET"
        objectType: "secretsmanager"
        objectAlias: "FILESCAN-CLIENT-SECRET"
{{- end }}
{{- else }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: "{{ .Values.app.name }}-kv-secrets"
  namespace: {{ .Values.namespace }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"

    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"

    keyvaultName: "{{ .Values.keyvault.name }}"

    tenantId: "{{ .Values.keyvault.tenantId }}"


    objects: |
      array:
{{- range .Values.keyvault.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ .type }}
{{- if .encoding }}
          objectEncoding: {{ .encoding }}
{{- end }}
{{- end }}

{{- if .Values.keyvault.otelOauthClientSecretName }}
  # Sync the value that the app reads as a literal env VALUE
  # (valueFrom.secretKeyRef) rather than a file - OTEL_OAUTH_CLIENT_SECRET is
  # read this way, not as a mounted path. Note: the CSI driver only
  # creates/updates this Secret once a pod actually mounts this
  # SecretProviderClass's CSI volume.
  secretObjects:
    - secretName: "{{ .Values.app.name }}-otel-truststore"
      type: Opaque
      data:
        # dpn-service-client's Keycloak secret - shared with oauth2-proxy,
        # which is why the Key Vault object name is the common
        # KC-SERVICE-CLIENT-SECRET, not a file-scan-specific one.
        - objectName: {{ .Values.keyvault.otelOauthClientSecretName }}
          key: oauth-client-secret
{{- end }}

# The truststore password used to be synced here too (as a private
# {app.name}-otel-truststore Secret, via keyvault.truststorePasswordSecretName)
# but that duplicated the identical value tls-auth-secret already publishes
# platform-wide. deployment.yaml now reads TRUSTSTORE_PASSWORD from
# tls-auth-secret directly instead.
{{- end }}
