name: DPN Uninstall - File Scan Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test

      cluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn01"
        type: choice
        options:
          - dpn01
          - dpn02

      cloud:
        description: "Target Cloud Provider"
        required: true
        default: "aws"
        type: choice
        options:
          - azure
          - aws

      confirm:
        description: 'Type "dpn-file-scan-service" to confirm'
        required: true
        type: string

env:
  PARAMETERS_FILE: .github/config/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.json
  PROJECT_NAME: dpn-file-scan-service

permissions:
  id-token: write
  contents: read

jobs:
  uninstall:
    name: Helm Uninstall - File Scan Service
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Validate Confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "$PROJECT_NAME" ]]; then
            echo "ERROR: confirmation text '${{ inputs.confirm }}' does not match '$PROJECT_NAME'."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Deployment Config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${PARAMETERS_FILE}" ]; then
            echo "ERROR: ${PARAMETERS_FILE} not found!"
            exit 1
          fi
          for key in $(jq -r 'keys_unsorted[]' "${PARAMETERS_FILE}"); do
            value=$(jq -r ".\"$key\"" "${PARAMETERS_FILE}")
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Pre-Uninstall Checklist
        shell: bash
        run: |
          echo "CONFIRM BEFORE PROCEEDING:"
          echo "1. This uninstalls the Helm release '$PROJECT_NAME'"
          echo "2. The cloud infrastructure provisioned by dpn-gha-file-scan-prerequisites-cd.yaml"
          echo "   (S3/SNS/SQS on AWS, Storage/Event Grid on Azure) is NOT removed by this workflow"
          echo "3. Secrets in the cloud secrets backend are untouched"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Helm Uninstall
        shell: bash
        run: |
          set -euo pipefail
          if ! helm status "$PROJECT_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Release '$PROJECT_NAME' not found in namespace '$NAMESPACE'. Nothing to uninstall."
            exit 0
          fi
          helm uninstall "$PROJECT_NAME" -n "$NAMESPACE" --wait --timeout 10m

      - name: Verification
        shell: bash
        run: |
          echo "Remaining Helm releases in $NAMESPACE:"
          helm list -n "$NAMESPACE"
          echo "Remaining pods matching file-scan:"
          kubectl get pods -n "$NAMESPACE" | grep file-scan || echo "(none)"
