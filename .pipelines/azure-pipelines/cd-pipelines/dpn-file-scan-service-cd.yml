parameters:
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      # test: placeholder names — replace with the actual sc-dpn-test-* connections
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

- name: environment
  displayName: Environment Name
  type: string
  default: 'dev'
  values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

# NOTE: dpncluster applies to dev/devtest only (dpn01 + dpn02).
# pdev/ptest/puat run on dpn01 only; selecting dpn02 for them fails fast
# in the "Read Environment Variables" guard below.
- name: dpncluster
  displayName: Target DPN Cluster (dpn02 = dev/devtest only)
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02

- name: imageTag
  type: string
  displayName: Image tag

# NOTE: the approver group is resolved automatically from the environment
# (see APPROVAL_GROUP variable) so a pre-prod deploy cannot be approved by the
# dev group: dev/devtest -> dsi-dev, pdev/ptest/puat -> dsi-ppd.

trigger:
  - none
  
pool:
  name: <<YOUR AGENT POOL>>

variables:
  - name: PROJECT_NAME
    value: 'dpn-file-scan-service'
  - name: SERVICE_CONNECTION
    value: '${{ parameters.ServiceConnection }}'
  - name: CHART_LOCATION
    value: 'charts/file-scan-service'
  # Config/values file resolution differs by environment family:
  #   pdev/ptest/puat -> single-name files (config/<env>.json, values-<env>.yaml), dpn01 only
  #   dev/devtest     -> per-cluster files (config/<env>-<cluster>.json, values-<env>-<cluster>.yaml)
  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: PARAMETERS_FILE
      value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpncluster }}.json"
    - name: VALUES_FILE
      value: "charts/file-scan-service/values-${{ parameters.environment }}-${{ parameters.dpncluster }}.yaml"
  - ${{ else }}:
    - name: PARAMETERS_FILE
      value: ".pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.dpncluster }}.json"
    - name: VALUES_FILE
      value: "charts/file-scan-service/values-${{ parameters.environment }}-${{ parameters.dpncluster }}.yaml"
  # Approver group by environment family:
  #   pdev/ptest/puat -> dsi-ppd (pre-prod)
  #   devtest/test    -> dsi-test
  #   dev             -> dsi-dev
  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-test
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

stages:
- stage: Deploy
  displayName: "Deploy"

  jobs:
  - deployment: Deploy
    displayName: "Helm Deploy"
    environment: $(APPROVAL_GROUP)

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              echo "Environment: ${{ parameters.environment }}"
              echo "PARAMETERS_FILE: $(PARAMETERS_FILE)"

              # Guard: pdev/ptest/puat run on dpn01 only (no dpn02 infrastructure).
              ENV="${{ parameters.environment }}"
              CLUSTER="${{ parameters.dpncluster }}"
              case "$ENV" in
                pdev|ptest|puat)
                  if [ "$CLUSTER" != "dpn01" ]; then
                    echo "##vso[task.logissue type=error]Environment '$ENV' supports dpn01 only; '$CLUSTER' is not available. Re-run with dpncluster=dpn01."
                    exit 1
                  fi
                  ;;
              esac

              # Ensure parameters file exists
              if [ -f "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)" ]; then
                echo "Reading parameters from $(PARAMETERS_FILE)"

                # Loop through each key-value pair in the JSON file and set pipeline variables
                for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
                  value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")

                  # Set the parameter as an Azure DevOps pipeline variable
                  echo "##vso[task.setvariable variable=$param]$value"
                  echo "Set parameter $param with $value"
                done
              else
                echo "Error: $(PARAMETERS_FILE) not found!"
                exit 1
              fi
            displayName: "Read Environment Variables"

          - task: AzureCLI@2
            displayName: 'AKS Auth'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: 'bash'
              addSpnToEnvironment: true
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "================================================="
                echo "AZURE AUTH"
                echo "================================================="
                az account set --subscription $(AZURE_SUBSCRIPTION_ID)
                az account show >/dev/null
                echo "Azure auth OK"

                echo "================================================="
                echo "INSTALL TOOLS"
                echo "================================================="
                if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
                  echo "kubectl or kubelogin not found, installing..."
                  az aks install-cli --client-version 1.36.1 --kubelogin-version v0.2.8
                else
                  echo "kubectl and kubelogin already installed, skipping install"
                fi
                kubectl version --client >/dev/null
                kubelogin --version >/dev/null
                helm version >/dev/null
                echo "Tools installed"

                echo "================================================="
                echo "AKS CONTEXT"
                echo "================================================="
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli
                echo "AKS context ready"

          - task: AzureCLI@2
            displayName: 'Helm Deploy'
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: 'bash'
              addSpnToEnvironment: true
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "================================================="
                echo "HELM DRY-RUN"
                echo "================================================="
                helm lint "$(CHART_LOCATION)"
                helm upgrade --install $(PROJECT_NAME) "$(CHART_LOCATION)" \
                  --set namespace="$(NAMESPACE)",image.repository="$(BASE_REGISTRY)/$(PROJECT_NAME)",image.tag="${{ parameters.imageTag }}" \
                  -n $(NAMESPACE) -f "$(VALUES_FILE)" \
                  --dry-run --debug >/dev/null
                echo "Helm dry-run OK"

                echo "================================================="
                echo "LOGIN TO ACR"
                echo "================================================="
                az acr login --name $(ACR_NAME)

                echo "================================================="
                echo "HELM DEPLOY"
                echo "================================================="
                # helm lint "$(CHART_LOCATION)"
                helm upgrade --install $(PROJECT_NAME) "$(CHART_LOCATION)" \
                  --set namespace="$(NAMESPACE)",image.repository="$(BASE_REGISTRY)/$(PROJECT_NAME)",image.tag="${{ parameters.imageTag }}" \
                  -n $(NAMESPACE) -f "$(VALUES_FILE)"
                echo "Helm deploy OK"

                echo "================================================="
                echo "POST-DEPLOY VERIFICATION"
                echo "================================================="

                kubectl get deployment $(PROJECT_NAME) -n $(NAMESPACE)

                kubectl rollout status deployment/$(PROJECT_NAME) -n $(NAMESPACE) --timeout=180s

                echo "================================================="
                echo " CAPTURE DEPLOYED IMAGE DIGEST"
                echo "================================================="

                IMAGE_DIGEST=$(kubectl get pods -n $(NAMESPACE) \
                  -l app=$(PROJECT_NAME) \
                  -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

                if [ -z "$IMAGE_DIGEST" ]; then
                  echo "##[error]Could not resolve deployed image digest from pod status"
                  exit 1
                fi

                echo "Deployed image digest: $IMAGE_DIGEST"

                mkdir -p "$(Build.ArtifactStagingDirectory)/deployed-digest"

                {
                  echo "$IMAGE_DIGEST"
                  echo "component=$(PROJECT_NAME)"
                  echo "environment=${{ parameters.environment }}"
                  echo "dpncluster=${{ parameters.dpncluster }}"
                  echo "imageTag=${{ parameters.imageTag }}"
                } > "$(Build.ArtifactStagingDirectory)/deployed-digest/$(PROJECT_NAME)-digest.txt"

                echo "Digest written to artifact staging directory"

                echo "================================================="
                echo "FILE SCAN DEPLOYMENT COMPLETE"
                echo "================================================="

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Deployed Image Digest'
            inputs:
              pathtoPublish: '$(Build.ArtifactStagingDirectory)/deployed-digest'
              ArtifactName: 'deployed-image-digest'